name: backend-ci

on:
  push:
    paths:
      - "VoiceIran/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "VoiceIran/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r VoiceIran/requirements.txt
          pip install -r VoiceIran/requirements-api.txt
          pip install ruff

      - name: Lint
        run: ruff check VoiceIran

      - name: Django check
        run: python VoiceIran/manage.py check --settings VoiceIran.settings_dev

      - name: Migration check
        run: python VoiceIran/manage.py makemigrations --check --dry-run --settings VoiceIran.settings_dev

      - name: Run tests
        run: python VoiceIran/manage.py test --settings VoiceIran.settings_test
