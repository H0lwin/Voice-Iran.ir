name: backend-ci

on:
  push:
    paths:
      - "VoiceIran/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "VoiceIran/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: VoiceIran

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            VoiceIran/requirements.txt
            VoiceIran/requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format Check
        run: ruff format --check .

      - name: Syntax Check
        run: python -m compileall .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    defaults:
      run:
        working-directory: VoiceIran

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            VoiceIran/requirements.txt
            VoiceIran/requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Django check (dev)
        run: python manage.py check --settings VoiceIran.settings_dev

      - name: Django check (prod deploy)
        env:
          DJANGO_SECRET_KEY: "ci-strong-secret-key-with-lots-of-entropy-1234567890"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api.example.com"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://example.com"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --settings VoiceIran.settings_prod

      - name: Migration check
        run: python manage.py makemigrations --check --dry-run --settings VoiceIran.settings_dev

      - name: Run tests
        run: python manage.py test --settings VoiceIran.settings_test
